<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redax — in-browser PII redaction</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #222; }
      textarea { width: 100%; min-height: 6rem; font-family: ui-monospace, monospace; padding: 0.5rem; }
      button { padding: 0.5rem 1rem; font-size: 1rem; margin-top: 0.5rem; }
      .out { margin-top: 1rem; padding: 0.75rem; background: #f6f6f6; border-radius: 6px; min-height: 4rem; white-space: pre-wrap; word-break: break-word; }
      .status { color: #666; font-size: 0.9rem; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>Redax</h1>
    <p>Self-hosted PII redaction, running entirely in your browser.</p>
    <label for="input">Input text</label>
    <textarea id="input" placeholder="Type text containing PII...">Email me at alice@example.com or call +1 415-555-2671</textarea>
    <button id="run">Redact</button>
    <div class="status" id="status">Loading model...</div>
    <h2>Redacted</h2>
    <div class="out" id="output"></div>

    <script type="module">
      import { redact } from "/pkg/redax.js";
      const btn = document.getElementById("run");
      const status = document.getElementById("status");
      const out = document.getElementById("output");
      btn.addEventListener("click", async () => {
        status.textContent = "Running...";
        const text = document.getElementById("input").value;
        try {
          const r = await redact(text);
          out.textContent = r.text;
          status.textContent = `Done. ${r.entities.length} entities.`;
        } catch (e) {
          status.textContent = `Error: ${e.message}`;
        }
      });
      // Warm
      try { await redact(document.getElementById("input").value); status.textContent = "Ready."; }
      catch (e) { status.textContent = `Model load error: ${e.message}`; }
    </script>
  </body>
</html>
