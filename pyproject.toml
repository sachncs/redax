[project]
name = "redax"
version = "0.1.0"
description = "Self-hosted PII redaction engine for use before a self-hosted LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "sachin", email = "sachncs@gmail.com" }]
# Exact pins only. Range specifiers are banned: the locking workflow
# (pip-compile -> requirements.lock) is the only sanctioned upgrade path.
# Deliberate version notes:
#   - transformers==4.57.6 is the latest 4.x; gliner2==2.0.0 requires
#     transformers<5 so the 5.x line is currently unavailable.
#   - redis==5.3.1 is the latest 5.x; arq==0.28.0 requires redis<6.
#   - huggingface-hub==0.36.2 is the latest 0.x; transformers==4.57.6
#     requires huggingface-hub<1.0.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "httpx==0.28.1",
    "redis==5.3.1",
    "arq==0.28.0",
    "prometheus-client==0.26.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp==1.44.0",
    "gliner2[local]==2.0.0",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Build-time only: optimum + onnxruntime are used by the WASM ONNX export
# pipeline (scripts/export_onnx.py, scripts/quantize.py), never at runtime.
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-approvaltests==0.2.4",
    "hypothesis==6.168.0",
    "locust==2.46.5",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "datasets==5.0.1",
    "pip-tools==7.6.1",
    "optimum==2.3.0",
    "onnxruntime==1.29.0",
    "pytest-cov==6.0.0",
]

[project.scripts]
redax-server = "app.main:run"
redax-worker = "app.jobs.queue:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "N"]
"scripts/*" = ["RUF001"]

[tool.mypy]
# The newest numpy ships PEP 695 stubs that require a 3.12 mypy target.
# Analysis still targets Python 3.11+ runtime semantics checkable here;
# CI (3.11) catches any 3.12-only syntax at runtime via pytest.
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy is a transitive dependency (via gliner2[local]); our code never
# types against it, so skip its analysis.
module = "numpy.*"
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Coverage is opt-in: `make test-cov` or `pytest --cov`.
# The default `make test` keeps plain `pytest -q` so a missing pytest-cov
# does not break CI.

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0  # informational only; tighten to 80 once coverage is at parity