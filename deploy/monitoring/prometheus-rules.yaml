apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: redax-alerts
  labels:
    app.kubernetes.io/name: redax
spec:
  groups:
    - name: redax.request
      rules:
        - alert: RedaxHighServerErrorRate
          expr: |
            sum(rate(redax_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(redax_requests_total[5m])), 1) > 0.01
          for: 10m
          labels:
            severity: page
            service: redax
          annotations:
            summary: Redax server error rate is above 1%
            runbook_url: https://github.com/sachncs/redax/blob/master/docs/runbooks/rollback.md
        - alert: RedaxHighRequestLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(redax_request_duration_seconds_bucket[10m]))) > 2
          for: 10m
          labels:
            severity: ticket
            service: redax
          annotations:
            summary: Redax p99 request latency is above 2 seconds
            runbook_url: https://github.com/sachncs/redax/blob/master/docs/runbooks/jobs.md
        - alert: RedaxResponseSizeRejections
          expr: increase(redax_response_rejections_total[10m]) > 0
          for: 5m
          labels:
            severity: ticket
            service: redax
          annotations:
            summary: Redax is rejecting oversized buffered responses
            runbook_url: https://github.com/sachncs/redax/blob/master/docs/runbooks/capacity.md
        - alert: RedaxRateLimitDependencyUnavailable
          expr: increase(redax_rate_limit_unavailable_total[10m]) > 0
          for: 5m
          labels:
            severity: page
            service: redax
          annotations:
            summary: Redis rate-limit checks are failing closed
            runbook_url: https://github.com/sachncs/redax/blob/master/docs/runbooks/redis.md
        - alert: RedaxRedisPoolSaturated
          expr: |
            redax_redis_pool_connections_max > 0
            and redax_redis_pool_connections_in_use
              / redax_redis_pool_connections_max > 0.9
          for: 5m
          labels:
            severity: ticket
            service: redax
          annotations:
            summary: Redax Redis connection pool is above 90% utilization
            runbook_url: https://github.com/sachncs/redax/blob/master/docs/runbooks/redis.md
        - alert: RedaxAuditWriteFailures
          expr: increase(redax_audit_write_failed_total[10m]) > 0
          for: 5m
          labels:
            severity: page
            service: redax
          annotations:
            summary: Redax audit writes are failing
            runbook_url: https://github.com/sachncs/redax/blob/master/docs/runbooks/audit.md
        - alert: RedaxTracingExportFailures
          expr: increase(redax_tracing_export_failures_total[10m]) > 0
          for: 5m
          labels:
            severity: ticket
            service: redax
          annotations:
            summary: Redax tracing exporter flushes are failing
            runbook_url: https://github.com/sachncs/redax/blob/master/docs/runbooks/rollback.md
        - alert: RedaxQueueAgeHigh
          expr: redax_queue_oldest_age_seconds > 300
          for: 10m
          labels:
            severity: page
            service: redax
          annotations:
            summary: Redax oldest durable job is older than five minutes
            runbook_url: https://github.com/sachncs/redax/blob/master/docs/runbooks/jobs.md
        - alert: RedaxJobRetriesIncreasing
          expr: increase(redax_job_retries_total[10m]) > 0
          for: 5m
          labels:
            severity: ticket
            service: redax
          annotations:
            summary: Redax durable jobs are retrying
            runbook_url: https://github.com/sachncs/redax/blob/master/docs/runbooks/jobs.md
    - name: redax.kubernetes
      rules:
        - alert: RedaxApiUnavailable
          expr: |
            kube_deployment_status_replicas_available{deployment="redax-api"} < 2
          for: 5m
          labels:
            severity: page
            service: redax
          annotations:
            summary: Fewer than two Redax API replicas are available
            runbook_url: https://github.com/sachncs/redax/blob/master/docs/runbooks/rollback.md
        - alert: RedaxWorkerUnavailable
          expr: |
            kube_deployment_status_replicas_available{deployment="redax-worker"} < 1
          for: 5m
          labels:
            severity: page
            service: redax
          annotations:
            summary: No Redax worker replica is available
            runbook_url: https://github.com/sachncs/redax/blob/master/docs/runbooks/jobs.md
        - alert: RedaxWorkerHeartbeatUnavailable
          expr: redax_active_workers < 1
          for: 5m
          labels:
            severity: page
            service: redax
          annotations:
            summary: No Redax worker heartbeat is visible to the API
            runbook_url: https://github.com/sachncs/redax/blob/master/docs/runbooks/jobs.md
        - alert: RedaxWorkerCapacitySaturated
          expr: |
            redax_worker_jobs_capacity > 0
            and redax_worker_jobs_active / redax_worker_jobs_capacity > 0.9
          for: 5m
          labels:
            severity: ticket
            service: redax
          annotations:
            summary: Redax worker job capacity is above 90%
            runbook_url: https://github.com/sachncs/redax/blob/master/docs/runbooks/jobs.md
