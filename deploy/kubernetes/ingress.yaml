apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redax-api
  annotations:
    # These annotations target ingress-nginx; use the equivalent settings for
    # another controller rather than silently accepting weaker defaults.
    nginx.ingress.kubernetes.io/proxy-body-size: 4m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    # Edge protection; the API-key limiter remains the tenant-level control.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "100"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [redax.example.com]
      secretName: redax-tls
  rules:
    - host: redax.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redax-api
                port:
                  name: http
