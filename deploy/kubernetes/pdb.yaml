apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redax-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: redax
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redax-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redax
      app.kubernetes.io/component: worker
