apiVersion: apps/v1
kind: Deployment
metadata:
  name: redax-api
  labels:
    app.kubernetes.io/name: redax
    app.kubernetes.io/component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redax
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redax
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/sachncs/redax
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: redax-config
            - secretRef:
                name: redax-api
          env:
            - name: REDAX_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redax-redis
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - {name: audit, mountPath: /var/lib/redax}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: redax-audit
        - name: tmp
          emptyDir: {}
