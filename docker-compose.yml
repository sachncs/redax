name: redax-local

services:
  redax:
    build: .
    image: redax/redax:0.1.0
    environment:
      # Compose service names are the only stable addresses inside this stack.
      REDAX_ENV: ${REDAX_ENV:?copy .env.example to .env}
      REDAX_LOG_LEVEL: ${REDAX_LOG_LEVEL:-INFO}
      REDAX_SERVICE_NAME: ${REDAX_SERVICE_NAME:-redax-local}
      REDAX_REDIS_REQUIRED: ${REDAX_REDIS_REQUIRED:-true}
      REDAX_REDIS_NAMESPACE: ${REDAX_REDIS_NAMESPACE:-redax-local}
      REDAX_DETECTOR: ${REDAX_DETECTOR:-gliner2}
      REDAX_RATE_LIMIT_PER_MINUTE: ${REDAX_RATE_LIMIT_PER_MINUTE:-600}
      REDAX_REDIS_URL: redis://redis:6379/0
      REDAX_MODEL_CACHE: /models
      REDAX_AUDIT_PATH: /var/lib/redax/audit.jsonl
      REDAX_POLICIES_DIR: /policies
      REDAX_OTLP_ENDPOINT: http://otel-collector:4317
      REDAX_TRUSTED_HOSTS: ${REDAX_TRUSTED_HOSTS:-localhost,127.0.0.1}
      REDAX_HASH_SALT: ${REDAX_HASH_SALT:?set REDAX_HASH_SALT in .env}
      REDAX_API_KEYS: ${REDAX_API_KEYS:?set REDAX_API_KEYS in .env}
      REDAX_JOB_PAYLOAD_ENCRYPTION_KEY: ${REDAX_JOB_PAYLOAD_ENCRYPTION_KEY:?set REDAX_JOB_PAYLOAD_ENCRYPTION_KEY in .env}
    ports:
      - "${REDAX_API_PORT:-8000}:8000"
    volumes:
      - redax-models:/models
      - redax-audit:/var/lib/redax
      - ./policies:/policies:ro
    networks:
      - redax
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8000/readyz', timeout=2).raise_for_status()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redax-worker:
    build: .
    image: redax/redax:0.1.0
    command: ["redax-worker"]
    environment:
      REDAX_ENV: ${REDAX_ENV:?copy .env.example to .env}
      REDAX_LOG_LEVEL: ${REDAX_LOG_LEVEL:-INFO}
      REDAX_SERVICE_NAME: ${REDAX_SERVICE_NAME:-redax-local}
      REDAX_REDIS_REQUIRED: ${REDAX_REDIS_REQUIRED:-true}
      REDAX_REDIS_NAMESPACE: ${REDAX_REDIS_NAMESPACE:-redax-local}
      REDAX_DETECTOR: ${REDAX_DETECTOR:-gliner2}
      REDAX_REDIS_URL: redis://redis:6379/0
      REDAX_MODEL_CACHE: /models
      REDAX_AUDIT_PATH: /var/lib/redax/audit.jsonl
      REDAX_POLICIES_DIR: /policies
      REDAX_OTLP_ENDPOINT: http://otel-collector:4317
      REDAX_TRUSTED_HOSTS: ${REDAX_TRUSTED_HOSTS:-localhost,127.0.0.1}
      REDAX_HASH_SALT: ${REDAX_HASH_SALT:?set REDAX_HASH_SALT in .env}
      REDAX_API_KEYS: ${REDAX_API_KEYS:?set REDAX_API_KEYS in .env}
      REDAX_JOB_PAYLOAD_ENCRYPTION_KEY: ${REDAX_JOB_PAYLOAD_ENCRYPTION_KEY:?set REDAX_JOB_PAYLOAD_ENCRYPTION_KEY in .env}
    volumes:
      - redax-models:/models
      - redax-audit:/var/lib/redax
      - ./policies:/policies:ro
    networks:
      - redax
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    volumes:
      - redax-redis:/data
    networks:
      - redax
    # AOF gives local job/rate-limit state a bounded recovery point. RDB
    # snapshots provide a second, portable backup format for operators.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--save",
        "900",
        "1",
        "--save",
        "300",
        "10",
        "--save",
        "60",
        "10000",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - redax
    healthcheck:
      test:
        [
          "CMD",
          "/otelcol-contrib",
          "validate",
          "--config=/etc/otelcol-contrib/config.yaml",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - redax-prometheus:/prometheus
    networks:
      - redax
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - redax-tempo:/var/tempo
    networks:
      - redax
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  loki:
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - redax-loki:/loki
    networks:
      - redax
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  promtail:
    image: grafana/promtail:3.5.0
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - redax
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - redax-grafana:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - redax
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  redax:
    driver: bridge

volumes:
  redax-models:
  redax-audit:
  redax-redis:
  redax-prometheus:
  redax-grafana:
  redax-loki:
  redax-tempo:
