services:
  redax:
    build: .
    image: redax/redax:0.1.0
    container_name: redax
    ports:
      - "8000:8000"
    environment:
      REDAX_LOG_LEVEL: INFO
      REDAX_REDIS_URL: redis://redis:6379/0
      REDAX_MODEL_CACHE: /models
      REDAX_AUDIT_PATH: /var/lib/redax/audit.jsonl
      REDAX_POLICIES_DIR: /policies
      REDAX_HASH_SALT: change-me
      REDAX_API_KEYS: dev-key
    volumes:
      - redax-models:/models
      - redax-audit:/var/lib/redax
      - ./policies:/policies:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/readyz', timeout=2).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redax-redis
    # DEV ONLY: in-memory only. For production swap the line below for
    #   ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    # or a managed Redis offering; ephemeral state breaks rate-limit
    # counters and any in-flight /v1/jobs admission on a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - redax-redis:/data
    restart: unless-stopped

volumes:
  redax-models:
  redax-audit:
  redax-redis:
