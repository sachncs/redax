name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: verify (tests + lint + typecheck + determinism)
        run: make verify

      - name: Verify commit author matches AGENTS.md convention
        run: |
          test "$(git log -1 --format='%an')" = "sachin" || \
            (echo "Last commit author is not 'sachin' per AGENTS.md" && exit 1)
          test "$(git log -1 --format='%ae')" = "sachncs@gmail.com" || \
            (echo "Last commit email is not 'sachncs@gmail.com' per AGENTS.md" && exit 1)

      - name: Eval gate
        run: python scripts/eval.py --fixture tests/fixtures/synthetic_pii.jsonl
