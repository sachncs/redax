name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps from lockfile
        run: |
          python -m pip install --upgrade pip
          # The lock is a flat, hash-pinned environment file. Avoid resolving
          # platform-only torch extras (not needed by this CPU CI gate).
          pip install --no-deps -r requirements.lock
          pip install -e . --no-deps

      - name: verify (tests + lint + typecheck + determinism)
        run: make verify

      - name: Verify commit author matches AGENTS.md convention
        run: |
          test "$(git log -1 --format='%an')" = "sachin" || \
            (echo "Last commit author is not 'sachin' per AGENTS.md" && exit 1)
          test "$(git log -1 --format='%ae')" = "sachncs@gmail.com" || \
            (echo "Last commit email is not 'sachncs@gmail.com' per AGENTS.md" && exit 1)

      - name: Eval gate
        run: python scripts/eval.py --fixture tests/fixtures/synthetic_pii.jsonl

  site-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci --no-audit --no-fund

      - name: Check site
        run: npm run check

      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sachncs.github.io/redax' }}
        run: npm run build
