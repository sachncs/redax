name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps from lockfile
        run: |
          python -m pip install --upgrade pip
          # The lock is a flat, hash-pinned environment file. Avoid resolving
          # platform-only torch extras (not needed by this CPU CI gate).
          pip install --no-deps --require-hashes -r requirements.lock
          pip install --no-deps pytest-cov==7.1.0 coverage==7.16.2
          pip install -e . --no-deps

      - name: verify (tests + lint + typecheck + determinism)
        run: make verify

      - name: Coverage gate
        run: make test-cov

      - name: Verify commit author matches AGENTS.md convention
        run: |
          test "$(git log -1 --format='%an')" = "sachin" || \
            (echo "Last commit author is not 'sachin' per AGENTS.md" && exit 1)
          test "$(git log -1 --format='%ae')" = "sachncs@gmail.com" || \
            (echo "Last commit email is not 'sachncs@gmail.com' per AGENTS.md" && exit 1)

      - name: Eval gate
        run: python scripts/eval.py --fixture tests/fixtures/synthetic_pii.jsonl

  site-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci --no-audit --no-fund

      - name: Check site
        run: npm run check

      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sachncs.github.io/redax' }}
        run: npm run build

  kubernetes-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Render reference topology
        run: kubectl kustomize deploy/kubernetes > redax-kubernetes.yaml

      - name: Create disposable Kubernetes API server
        run: kind create cluster --name redax-manifest --wait 60s

      - name: Create reference namespace for server validation
        run: kubectl apply -f deploy/kubernetes/namespace.yaml

      - name: Strictly validate rendered resources
        run: kubectl apply --dry-run=server --validate=strict -f redax-kubernetes.yaml

      - name: Assert production topology invariants
        run: |
          test "$(grep -c '^kind: Deployment$' redax-kubernetes.yaml)" -eq 2
          grep -q 'replicas: 3' redax-kubernetes.yaml
          grep -q 'replicas: 2' redax-kubernetes.yaml
          grep -q 'kind: PodDisruptionBudget' redax-kubernetes.yaml
          grep -q 'readOnlyRootFilesystem: true' redax-kubernetes.yaml
          grep -q 'runAsNonRoot: true' redax-kubernetes.yaml
          grep -q 'digest: sha256:' deploy/kubernetes/kustomization.yaml
          ! grep -Eq 'image: [^[:space:]]+:latest([[:space:]]|$)' redax-kubernetes.yaml

      - name: Upload rendered topology
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redax-kubernetes-manifests-${{ github.sha }}
          path: redax-kubernetes.yaml

  kubernetes-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create disposable Kubernetes cluster
        run: kind create cluster --name redax-smoke --wait 60s

      - name: Build and load the current image
        run: |
          docker build --tag "redax-smoke:${GITHUB_SHA}" .
          kind load docker-image "redax-smoke:${GITHUB_SHA}" --name redax-smoke

      - name: Create namespace
        run: kubectl apply -f deploy/kubernetes/namespace.yaml

      - name: Start disposable Redis and configure production secrets
        run: |
          kubectl -n redax create deployment redax-redis --image=redis:7.2-alpine
          kubectl -n redax expose deployment redax-redis --name=redax-redis --port=6379
          kubectl -n redax create secret generic redax-api \
            --from-literal=REDAX_API_KEYS=ci-smoke-key \
            --from-literal=REDAX_HASH_SALT=ci-smoke-hash-salt \
            --from-literal=job_payload_encryption_key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --from-literal=audit_integrity_key=ci-smoke-audit-integrity-key
          kubectl -n redax create secret generic redax-redis \
            --from-literal=url=redis://redax-redis:6379/0
          kubectl -n redax rollout status deployment/redax-redis --timeout=180s

      - name: Deploy the pinned Redax image
        run: |
          kubectl kustomize deploy/kubernetes \
            | sed -E "s#ghcr.io/sachncs/redax@sha256:[^[:space:]]+#redax-smoke:${GITHUB_SHA}#g" \
            | kubectl apply -f -
          kubectl -n redax rollout status deployment/redax-api --timeout=600s
          kubectl -n redax rollout status deployment/redax-worker --timeout=600s

      - name: Exercise API, durable jobs, and rollout rollback
        run: |
          kubectl -n redax port-forward service/redax-api 18000:8000 > /tmp/redax-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              -H 'Host: redax.example.com' \
              http://127.0.0.1:18000/readyz > /tmp/redax-ready.json; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error \
            -H 'Host: redax.example.com' \
            http://127.0.0.1:18000/readyz > /tmp/redax-ready.json
          curl --fail --silent --show-error \
            -H 'Host: redax.example.com' \
            -H 'X-API-Key: ci-smoke-key' \
            -H 'Idempotency-Key: ci-smoke-redact-1' \
            -H 'Content-Type: application/json' \
            --data '{"text":"Contact smoke@example.com for a safe response."}' \
            http://127.0.0.1:18000/v1/redact > /tmp/redax-redact.json
          test "$(python -c 'import json; print(json.load(open("/tmp/redax-redact.json"))["text"])')" = 'Contact [EMAIL_0000] for a safe response.'
          curl --fail --silent --show-error \
            -H 'Host: redax.example.com' \
            -H 'X-API-Key: ci-smoke-key' \
            -H 'Content-Type: application/json' \
            --data '{"text":"Job smoke@example.com"}' \
            http://127.0.0.1:18000/v1/jobs > /tmp/redax-job.json
          job_id="$(python -c 'import json; print(json.load(open("/tmp/redax-job.json"))["id"])')"
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error \
              -H 'Host: redax.example.com' \
              -H 'X-API-Key: ci-smoke-key' \
              "http://127.0.0.1:18000/v1/jobs/${job_id}" > /tmp/redax-job-status.json
            status="$(python -c 'import json; print(json.load(open("/tmp/redax-job-status.json"))["status"])')"
            test "$status" = done && break
            test "$status" != queued && test "$status" != running && exit 1
            sleep 2
          done
          test "$(python -c 'import json; print(json.load(open("/tmp/redax-job-status.json"))["status"])')" = done
          for deployment in redax-api redax-worker; do
            stamp="$(date -u +%s)"
            kubectl -n redax patch deployment "$deployment" --type=merge \
              -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"redax.dev/smoke-revision\":\"$stamp\"}}}}}"
            kubectl -n redax rollout status deployment/"$deployment" --timeout=600s
            kubectl -n redax rollout undo deployment/"$deployment"
            kubectl -n redax rollout status deployment/"$deployment" --timeout=600s
          done

      - name: Collect disposable smoke diagnostics
        if: failure()
        run: |
          kubectl -n redax get pods -o wide | tee /tmp/redax-kubectl-pods.txt
          kubectl -n redax describe deployment redax-api | tee /tmp/redax-kubectl-api.txt
          kubectl -n redax describe deployment redax-worker | tee /tmp/redax-kubectl-worker.txt
          for pod in $(kubectl -n redax get pods -o name); do
            safe_name="${pod//\//-}"
            kubectl -n redax describe "$pod" > "/tmp/redax-kubectl${safe_name}.txt" || true
            kubectl -n redax logs "$pod" --all-containers --prefix --tail=200 >> "/tmp/redax-kubectl${safe_name}.txt" 2>&1 || true
          done

      - name: Upload disposable smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redax-kubernetes-smoke-${{ github.sha }}
          path: |
            /tmp/redax-*.json
            /tmp/redax-kubectl-*.txt
            /tmp/redax-port-forward.log

  performance:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps --require-hashes -r requirements.lock
          pip install -e . --no-deps

      - name: Run regex API performance ramp gate
        env:
          REDAX_ENV: dev
          REDAX_DETECTOR: regex
          REDAX_REDIS_URL: redis://127.0.0.1:6379/0
          REDAX_REDIS_REQUIRED: "true"
          REDAX_REDIS_NAMESPACE: ci-performance
          REDAX_HASH_SALT: ci-load-salt
          REDAX_API_KEYS: ci-job-key
          REDAX_AUDIT_BACKEND: file
          REDAX_RATE_LIMIT_PER_MINUTE: "0"
          REDAX_AUDIT_PATH: /tmp/redax-ci-audit.jsonl
          REDAX_WORKER_CONCURRENCY: "2"
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 > /tmp/redax-api.log 2>&1 &
          api_pid=$!
          redax-worker > /tmp/redax-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8010/healthz && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8010/healthz
          for concurrency in 10 40 80; do
            python scripts/load_bench.py \
              --url http://127.0.0.1:8010/v1/redact \
              --mode redact \
              --api-key ci-job-key \
              --requests 500 \
              --concurrency "$concurrency" \
              --fail-on-error \
              --max-p99-ms 1000 \
              --output "performance-${concurrency}.json"
          done
          python scripts/load_bench.py \
            --url http://127.0.0.1:8010/v1/redact/batch \
            --mode batch \
            --api-key ci-job-key \
            --requests 200 \
            --concurrency 10 \
            --fail-on-error \
            --max-p99-ms 1000 \
            --output performance-batch.json
          python scripts/load_bench.py \
            --url http://127.0.0.1:8010/v1/redact/stream \
            --mode stream \
            --api-key ci-job-key \
            --requests 200 \
            --concurrency 10 \
            --fail-on-error \
            --max-p99-ms 1000 \
            --output performance-stream.json
          python scripts/load_bench.py \
            --url http://127.0.0.1:8010/v1/redact \
            --mode cache-hot \
            --api-key ci-job-key \
            --requests 100 \
            --concurrency 10 \
            --fail-on-error \
            --max-p99-ms 1000 \
            --output performance-cache-hot.json
          python scripts/load_bench.py \
            --url http://127.0.0.1:8010/v1/redact \
            --mode cache-cold \
            --api-key ci-job-key \
            --requests 100 \
            --concurrency 10 \
            --fail-on-error \
            --max-p99-ms 1000 \
            --output performance-cache-cold.json
          python scripts/load_bench.py \
            --url http://127.0.0.1:8010/v1/redact \
            --mode redact \
            --api-key ci-job-key \
            --duration-seconds 15 \
            --concurrency 20 \
            --fail-on-error \
            --max-p99-ms 1000 \
            --output performance-soak.json
          python scripts/load_bench.py \
            --url http://127.0.0.1:8010/v1/jobs \
            --mode job \
            --api-key ci-job-key \
            --requests 100 \
            --concurrency 10 \
            --job-poll-timeout 30 \
            --fail-on-error \
            --max-p99-ms 5000 \
            --output performance-jobs.json

      - name: Upload performance artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redax-api-performance-${{ github.sha }}
          path: performance-*.json

  redis-reliability:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Redis server for restart and restore drills
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps --require-hashes -r requirements.lock
          pip install -e . --no-deps

      - name: Run real Redis reliability and replica suites
        env:
          REDAX_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          python -m pytest \
            tests/integration/test_redis_jobs.py \
            tests/integration/test_api_replicas.py \
            -q --junitxml=redis-reliability.xml

      - name: Upload Redis reliability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redax-redis-reliability-${{ github.sha }}
          path: redis-reliability.xml
