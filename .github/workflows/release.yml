name: release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Wait for exact-commit CI and security gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            all_success=true
            for workflow in ci.yml security.yml; do
              run_json="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --commit "$GITHUB_SHA" \
                --limit 20 \
                --json status,conclusion,createdAt,databaseId)"
              gate_state="$(python -c '
          import json, sys
          runs = json.load(sys.stdin)
          if not runs:
              print("pending")
          else:
              latest = max(runs, key=lambda run: run["createdAt"])
              if latest["status"] != "completed":
                  print("pending")
              elif latest["conclusion"] == "success":
                  print("success")
              else:
                  print("failed")
          ' <<<"$run_json")"
              case "$gate_state" in
                success) ;;
                pending) all_success=false ;;
                failed)
                  echo "$workflow exact-commit gate failed" >&2
                  exit 1
                  ;;
              esac
            done
            if [ "$all_success" = true ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "required exact-commit gates did not pass before timeout" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.release.lock

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify tag matches project version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} .

      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: dist/sbom-${{ github.ref_name }}.cdx.json
          artifact-name: sbom-${{ github.ref_name }}.cdx.json

      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          scan-type: image
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        run: |
          image="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          docker push "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate release metadata
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python scripts/release_metadata.py \
            --output dist/RELEASE-METADATA.json \
            --image-digest "${{ steps.push.outputs.digest }}"

      - name: Verify metadata binds the published image
        env:
          EXPECTED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test "$(python -c 'import json; print(json.load(open("dist/RELEASE-METADATA.json"))["container_image_digest"])')" = "$EXPECTED_DIGEST"

      - name: Generate artifact checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: cosign sign --yes "$IMAGE"

      - name: Attest release provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redax-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/RELEASE-METADATA.json
            dist/sbom-*.cdx.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Redax $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/RELEASE-METADATA.json
