<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Redax — Self-hosted PII redaction for the LLM era">
  <title>Redax</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070710"/>
      <stop offset="100%" stop-color="#0d0810"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.0" r="1.0">
      <stop offset="0%" stop-color="#E0334E" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#E0334E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5C5C"/>
      <stop offset="55%" stop-color="#E0334E"/>
      <stop offset="100%" stop-color="#7A1A3B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(96, 96)">
    <rect width="96" height="96" rx="22" fill="url(#mark)"/>
    <path d="M28 26 h22 a12 12 0 0 1 12 12 v3 a9 9 0 0 1 -9 9 h-12 l-3 0 14 19 h-12 l-12 -19 V26 z M40 36 v9 h9 a4.5 4.5 0 0 0 4.5 -4.5 v0 a4.5 4.5 0 0 0 -4.5 -4.5 z"
          fill="#ffffff" opacity="0.97"/>
    <rect x="22" y="70" width="50" height="5" rx="2.5" fill="#ffffff" opacity="0.85"/>
    <text x="120" y="64" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-1.2" fill="#ffffff">redax</text>
  </g>

  <g transform="translate(96, 240)">
    <text font-family="Inter, system-ui, sans-serif" font-size="88" font-weight="600" letter-spacing="-3.5" fill="#ffffff">
      <tspan x="0" y="80">Redact before</tspan>
      <tspan x="0" y="180" fill="#ffd9a3">you prompt.</tspan>
    </text>
    <text x="0" y="240" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="400" letter-spacing="-0.4" fill="#a8aebd">
      <tspan x="0" y="240">A self-hosted PII redaction engine for the LLM era.</tspan>
      <tspan x="0" y="276">Deterministic. Auditable. CPU-friendly.</tspan>
    </text>
  </g>

  <g transform="translate(96, 540)" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" fill="#7c8597">
    <text x="0" y="0">$ docker compose up</text>
    <text x="380" y="0">$ curl -X POST localhost:8000/v1/redact -d '{"text":"alice@example.com"}'</text>
  </g>
</svg>
